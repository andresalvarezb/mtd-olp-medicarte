services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authorization
      POSTGRES_USER: authorization
      POSTGRES_PASSWORD: authorization
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authorization -d authorization']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  migrate:
    image: authorization-platform-api:local
    working_dir: /workspace
    command: ['node', 'packages/database/dist/migrate.js']
    environment:
      DATABASE_URL: postgresql://authorization:authorization@postgres:5432/authorization
    depends_on:
      postgres:
        condition: service_healthy

  mipres-mock:
    image: node:22-alpine
    working_dir: /mock
    command: ['node', 'server.mjs']
    environment:
      PORT: 8090
      MIPRES_MOCK_INITIAL_TOKEN: initial-secret
      MIPRES_MOCK_OPERATIVE_TOKEN: operative-token
    volumes:
      - ./infra/mipres-mock:/mock:ro

  api:
    image: authorization-platform-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://authorization:authorization@postgres:5432/authorization
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
      AUTH_JWT_TTL_SECONDS: 28800
      AUTH_BOOTSTRAP_ADMIN_USERNAME: foundation-admin
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: foundation-admin
      API_PUBLIC_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3002
      API_PORT: 3001
      IMPORT_MAX_FILE_BYTES: 20971520
      IMPORT_PROCESSOR_VERSION: 2
      MIPRES_BASE_URL: http://mipres-mock:8090
      MIPRES_NIT: 900123456
      MIPRES_INITIAL_TOKEN: initial-secret
      MIPRES_MANUAL_RECHECK_DAILY_LIMIT: 3
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://authorization:authorization@postgres:5432/authorization
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: 'true'
      OUTBOX_POLL_INTERVAL_MS: 500
      IMPORT_MAX_FILE_BYTES: 20971520
      IMPORT_PROCESSOR_VERSION: 2
      IMPORT_QUEUE_CONCURRENCY: 3
      MIPRES_BASE_URL: http://mipres-mock:8090
      MIPRES_NIT: 900123456
      MIPRES_INITIAL_TOKEN: initial-secret
      MIPRES_AUTO_REVALIDATION_INTERVAL_MS: 0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mipres-mock:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '127.0.0.1:3002:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
