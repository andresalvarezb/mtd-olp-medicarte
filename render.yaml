version: '1'

services:
  - type: web
    name: authorization-web
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: '10000'
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: authorization-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: authorization-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    preDeployCommand: node packages/database/dist/migrate.js
    envVars:
      - key: PORT
        value: '10000'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: authorization-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: authorization-keyvalue
          type: keyvalue
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_JWT_TTL_SECONDS
        value: '28800'
      - key: AUTH_BOOTSTRAP_ADMIN_USERNAME
        value: foundation-admin
      - key: AUTH_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: AUTH_BOOTSTRAP_MTD_GENERAL_PASSWORD
        sync: false
      - key: AUTH_BOOTSTRAP_MTD_AUDITORIA_PASSWORD
        sync: false
      - key: API_PUBLIC_URL
        fromService:
          name: authorization-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_ORIGIN
        value: https://authorization-web.onrender.com

  - type: worker
    name: authorization-worker
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/worker.Dockerfile
    dockerContext: .
    preDeployCommand: node packages/database/dist/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: authorization-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: authorization-keyvalue
          type: keyvalue
          property: connectionString
      - key: SCHEDULER_ENABLED
        value: 'true'
      - key: MIPRES_BASE_URL
        value: https://wsmipres.sispro.gov.co/WSSUMMIPRESNOPBS
      - key: MIPRES_NIT
        sync: false
      - key: MIPRES_INITIAL_TOKEN
        sync: false

  - type: keyvalue
    name: authorization-keyvalue
    region: virginia
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: authorization-db
    region: virginia
    plan: 0.5c-1g
    postgresMajorVersion: '17'
    databaseName: authorization
    user: authorization
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
