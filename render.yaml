version: '1'

services:
  - type: web
    name: authorization-web
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: '10000'
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_URL
        value: https://authorization-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_OIDC_ISSUER
        value: https://authorization-keycloak.onrender.com/realms/authorization
      - key: NEXT_PUBLIC_OIDC_CLIENT_ID
        value: authorization-web

  - type: web
    name: authorization-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    preDeployCommand: node packages/database/dist/migrate.js
    envVars:
      - key: PORT
        value: '10000'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: authorization-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: authorization-keyvalue
          type: keyvalue
          property: connectionString
      - key: OIDC_ISSUER
        value: https://authorization-keycloak.onrender.com/realms/authorization
      - key: OIDC_AUDIENCE
        value: authorization-api
      - key: OIDC_ADMIN_ISSUER
        value: https://authorization-keycloak.onrender.com/realms/authorization
      - key: OIDC_ADMIN_CLIENT_ID
        value: authorization-admin
      - key: OIDC_ADMIN_CLIENT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        value: https://authorization-api.onrender.com
      - key: WEB_ORIGIN
        value: https://authorization-web.onrender.com

  - type: worker
    name: authorization-worker
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/worker.Dockerfile
    dockerContext: .
    preDeployCommand: node packages/database/dist/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: authorization-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: authorization-keyvalue
          type: keyvalue
          property: connectionString
      - key: OIDC_ISSUER
        value: https://authorization-keycloak.onrender.com/realms/authorization
      - key: OIDC_AUDIENCE
        value: authorization-api
      - key: SCHEDULER_ENABLED
        value: 'true'
      - key: MIPRES_BASE_URL
        value: https://wsmipres.sispro.gov.co/WSSUMMIPRESNOPBS
      - key: MIPRES_NIT
        sync: false
      - key: MIPRES_INITIAL_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false

  - type: web
    name: authorization-keycloak
    runtime: docker
    region: virginia
    plan: 1c-2g
    dockerfilePath: ./infra/docker/keycloak.Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: '10000'
      - key: KC_HTTP_PORT
        value: '10000'
      - key: KC_HTTP_ENABLED
        value: 'true'
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HOSTNAME
        value: https://authorization-keycloak.onrender.com
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: authorization-keycloak-db
          property: host
      - key: KC_DB_URL_PORT
        fromDatabase:
          name: authorization-keycloak-db
          property: port
      - key: KC_DB_URL_DATABASE
        fromDatabase:
          name: authorization-keycloak-db
          property: database
      - key: KC_DB_USERNAME
        fromDatabase:
          name: authorization-keycloak-db
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: authorization-keycloak-db
          property: password
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: mtd-keycloak-admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: WEB_ORIGIN
        value: https://authorization-web.onrender.com
      - key: OIDC_ADMIN_CLIENT_SECRET
        fromService:
          name: authorization-api
          type: web
          envVarKey: OIDC_ADMIN_CLIENT_SECRET
      - key: KEYCLOAK_FOUNDATION_ADMIN_PASSWORD
        generateValue: true
      - key: KEYCLOAK_OLP_OPERATOR_PASSWORD
        generateValue: true
      - key: KEYCLOAK_MEDICARTE_OPERATOR_PASSWORD
        generateValue: true

  - type: keyvalue
    name: authorization-keyvalue
    region: virginia
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: authorization-db
    region: virginia
    plan: 0.5c-1g
    postgresMajorVersion: '17'
    databaseName: authorization
    user: authorization
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []

  - name: authorization-keycloak-db
    region: virginia
    plan: 0.5c-1g
    postgresMajorVersion: '17'
    databaseName: keycloak
    user: keycloak
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
