name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  quality-and-gate-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose up -d --wait postgres redis keycloak
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://authorization:authorization@localhost:15432/authorization
      - run: docker compose up -d --build --wait api worker web
      - run: pnpm test:integration
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
